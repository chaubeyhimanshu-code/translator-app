<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Indian Legal Translator</title>
  <!-- docx UMD build for building the .docx in the browser. Exposes window.docx -->
  <script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
  <style>
    :root { --ink:#1F2D5C; --mint:#80D0B0; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
           max-width: 720px; margin: 40px auto; padding: 0 20px; color: #1a1a1a; }
    h1 { color: var(--ink); font-size: 22px; }
    .card { border: 1px solid #e2e2e2; border-radius: 10px; padding: 20px; margin-top: 16px; }
    label { display: block; font-weight: 600; margin: 12px 0 4px; font-size: 14px; }
    input[type="number"] { width: 120px; padding: 8px; border: 1px solid #ccc; border-radius: 6px; }
    input[type="file"] { display: block; margin-top: 6px; }
    .row { display: flex; gap: 24px; flex-wrap: wrap; }
    button { background: var(--ink); color: #fff; border: 0; padding: 12px 20px;
             border-radius: 8px; font-size: 15px; cursor: pointer; margin-top: 18px; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    #status { margin-top: 16px; font-size: 14px; min-height: 20px; }
    .err { color: #b00020; }
    .ok { color: #0a7d4d; }
    .muted { color: #666; font-size: 13px; }
    textarea { width: 100%; height: 240px; margin-top: 14px; padding: 10px;
               border: 1px solid #ccc; border-radius: 6px; font-family: monospace; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Indian Legal Document Translator</h1>
  <p class="muted">PDF / DOCX / TXT &rarr; English. Output formatted for Supreme Court filing
    (Times New Roman 12pt, 1.5 spacing, justified).</p>
 
  <div class="card">
    <label for="file">Document</label>
    <input type="file" id="file" accept=".pdf,.docx,.txt" />
    <div id="pageinfo" class="muted"></div>
 
    <div class="row">
      <div>
        <label for="startPage">Start page</label>
        <input type="number" id="startPage" min="1" value="1" />
      </div>
      <div>
        <label for="endPage">End page</label>
        <input type="number" id="endPage" min="1" value="1" />
      </div>
    </div>
    <p class="muted">Page range applies to PDFs only.</p>
 
    <button id="go" disabled>Translate &amp; Download .docx</button>
    <div id="status"></div>
    <textarea id="preview" placeholder="Translated text will appear here..." style="display:none"></textarea>
  </div>
 
  <script>
    const fileInput = document.getElementById('file');
    const startInput = document.getElementById('startPage');
    const endInput = document.getElementById('endPage');
    const goBtn = document.getElementById('go');
    const statusEl = document.getElementById('status');
    const pageInfo = document.getElementById('pageinfo');
    const preview = document.getElementById('preview');
 
    function setStatus(msg, cls) {
      statusEl.className = cls || '';
      statusEl.textContent = msg;
    }
 
    fileInput.addEventListener('change', async () => {
      preview.style.display = 'none';
      pageInfo.textContent = '';
      const file = fileInput.files[0];
      if (!file) { goBtn.disabled = true; return; }
      goBtn.disabled = false;
      setStatus('Reading file...', '');
      try {
        const fd = new FormData();
        fd.append('file', file);
        const r = await fetch('/api/pagecount', { method: 'POST', body: fd });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Could not read file');
        endInput.value = data.pageCount;
        endInput.max = data.pageCount;
        startInput.max = data.pageCount;
        pageInfo.textContent = data.exact
          ? `${data.pageCount} pages.`
          : `~${data.pageCount} pages (estimated; page range ignored for ${data.type}).`;
        setStatus('Ready.', 'ok');
      } catch (e) {
        setStatus(e.message, 'err');
      }
    });
 
    goBtn.addEventListener('click', async () => {
      const file = fileInput.files[0];
      if (!file) return;
      goBtn.disabled = true;
      preview.style.display = 'none';
      setStatus('Translating... this can take a while for long documents.', '');
      try {
        const fd = new FormData();
        fd.append('file', file);
        fd.append('startPage', startInput.value || '1');
        fd.append('endPage', endInput.value || '0');
 
        const r = await fetch('/api/translate', { method: 'POST', body: fd });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Translation failed');
 
        const text = data.translation || '';
        preview.value = text;
        preview.style.display = 'block';
 
        await buildDocx(text, file.name);
        setStatus('Done. Your .docx has downloaded.', 'ok');
      } catch (e) {
        setStatus(e.message, 'err');
      } finally {
        goBtn.disabled = false;
      }
    });
 
    async function buildDocx(text, sourceName) {
      const { Document, Packer, Paragraph, TextRun, AlignmentType } = window.docx;
 
      // Split into paragraphs on blank lines; keep single lines together.
      const blocks = text.split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
 
      const paragraphs = blocks.map(block => new Paragraph({
        alignment: AlignmentType.JUSTIFIED,
        spacing: { line: 360, lineRule: 'auto' }, // 360 = 1.5 line spacing
        children: [ new TextRun({ text: block.replace(/\n/g, ' '), font: 'Times New Roman', size: 24 }) ], // size 24 half-points = 12pt
      }));
 
      const doc = new Document({
        styles: {
          default: {
            document: {
              run: { font: 'Times New Roman', size: 24 },
            },
          },
        },
        sections: [{ children: paragraphs }],
      });
 
      const blob = await Packer.toBlob(doc);
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const base = (sourceName || 'document').replace(/\.[^.]+$/, '');
      a.href = url;
      a.download = base + '_EN.docx';
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
